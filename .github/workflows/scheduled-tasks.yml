name: Scheduled tasks - run fines/checks

on:
  schedule:
    # Workflow times are in UTC (MSK = UTC+3).
    - cron: '55 20 * * *' # 20:55 UTC -> 23:55 MSK (fines check)
  workflow_dispatch: {}

jobs:
  run-scheduled-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci
          npx prisma generate

      - name: Run scheduled tasks
        env:
          TZ: Europe/Moscow
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node ./scripts/run-fine-checks.js
