name: Scheduled tasks - run fines/checks

on:
  schedule:
    # Main run daily at 23:55 Moscow time (MSK = UTC+3). Workflow times are in UTC.
    # 23:55 MSK = 20:55 UTC
    - cron: '55 20 * * *' # 20:55 UTC -> 23:55 MSK
  workflow_dispatch: {}

jobs:
  run-scheduled-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci
          npx prisma generate

      - name: Run scheduled tasks
        env:
          TZ: Europe/Moscow
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional secrets for amo/vk if needed by the script
          AMO_REFRESH_TOKEN: ${{ secrets.AMO_REFRESH_TOKEN }}
          AMO_CLIENT_ID: ${{ secrets.AMO_CLIENT_ID }}
          AMO_CLIENT_SECRET: ${{ secrets.AMO_CLIENT_SECRET }}
          AMO_SUBDOMAIN: ${{ secrets.AMO_SUBDOMAIN }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
        run: |
          node ./scripts/run-scheduled-tasks.js
