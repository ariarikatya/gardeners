<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нет сети · Анемон</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 2rem 1.5rem;
      border-radius: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      max-width: 24rem;
      width: 100%;
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 0.5rem 0;
      color: #065f46;
      font-weight: 700;
    }
    p {
      font-size: 0.875rem;
      color: #475569;
      line-height: 1.5;
      margin: 0 0 1.25rem 0;
    }
    .hint {
      font-size: 0.8125rem;
      color: #64748b;
      background: #f1f5f9;
      padding: 0.75rem;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
    }
    button {
      background: #059669;
      color: #ffffff;
      border: none;
      border-radius: 0.75rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      min-height: 44px;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #047857;
    }
    button:active {
      background: #065f46;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌿</div>
    <h1 id="offline-title">Нет подключения к сети</h1>
    <p id="offline-desc">Данные ещё ни разу не загружались на этом устройстве.</p>
    <div class="hint" id="offline-hint">
      Если вы уже входили ранее, проверьте подключение к интернету и нажмите кнопку ниже.
    </div>
    <div id="cached-summary" style="display:none; margin-bottom: 1.25rem; font-size: 0.8125rem; text-align: left; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 0.75rem; padding: 0.75rem; color: #166534;">
      <div style="font-weight: 600; margin-bottom: 0.25rem;">📦 Доступен локальный кэш:</div>
      <div id="cached-meta"></div>
    </div>
    <button type="button" onclick="window.location.reload()">Повторить</button>
    <button type="button" style="margin-top: 0.5rem; background: #e2e8f0; color: #0f172a;" onclick="window.location.assign('/gardener')">Перейти в кабинет</button>
  </div>
  <script>
    (function checkIdb() {
      try {
        var req = indexedDB.open('gardener_offline_db');
        req.onsuccess = function(e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains('data_cache')) return;
          var tx = db.transaction('data_cache', 'readonly');
          var store = tx.objectStore('data_cache');
          var allReq = store.getAll();
          allReq.onsuccess = function() {
            var items = allReq.result || [];
            var fullSnap = items.find(function(it) {
              return it && it.key && it.key.indexOf('snapshot_full::') === 0;
            });
            if (fullSnap && fullSnap.data && Array.isArray(fullSnap.data.orders)) {
              var count = fullSnap.data.orders.length;
              var dateStr = fullSnap.data.savedAt ? new Date(fullSnap.data.savedAt).toLocaleDateString('ru-RU') + ' ' + new Date(fullSnap.data.savedAt).toLocaleTimeString('ru-RU') : 'ранее';
              document.getElementById('offline-title').textContent = 'Офлайн-режим';
              document.getElementById('offline-desc').textContent = 'Показаны сохранённые данные от ' + dateStr + '.';
              document.getElementById('cached-summary').style.display = 'block';
              document.getElementById('cached-meta').textContent = 'Сохранено заказов: ' + count;
            }
          };
        };
      } catch (e) {}
    })();
  </script>
</body>
</html>
